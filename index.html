<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fast Screen Recorder (Video + System Audio)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: black;}
    button { margin: 6px; padding: 10px 20px; font-size: 16px;}
	.btn-cl { text-align: center; margin-top: 30vh; }

	/* footer */
.powered {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: clamp(10px, 1.2vw, 14px); /* small on all screens */
  letter-spacing: 1px;
  opacity: 0.8;
  text-align: center;
}

/* link highlight */
.powered a {
  color: #fff;
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.6);
  padding: 2px 4px;
  margin-left: 4px;
  transition: all 0.2s ease;
}

.powered a:hover {
  background: rgba(255,255,255,0.1);
  border-bottom: 1px solid #fff;
  opacity: 1;
}
	
  </style>
</head>
<body>
		<div class="btn-cl">
			<button id="startBtn">Start Recording</button>
			<button id="stopBtn" disabled>Stop & Download</button>
		</div>
  <p id="msg"></p>

<div class="powered">
  powered by 
  <a href="https://www.instagram.com/digitaldeba101?igsh=MTY5NGsyemwyNDV2OQ==" target="_blank">debajyoti</a>
</div>
  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const msg = document.getElementById('msg');

    let recorder, chunks = [];

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      stopBtn.disabled = false;
      msg.textContent = "Recording... (check 'Share system audio')";

      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp8,opus' });

        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);

          const a = document.createElement('a');
          a.href = url;
          a.download = 'meeting-recording.webm';
          a.click();

          msg.textContent = "? Downloaded meeting-recording.webm";
          chunks = [];
          stream.getTracks().forEach(t => t.stop());
        };

        recorder.start();
      } catch (err) {
        alert('Error: ' + err.message);
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    };

    stopBtn.onclick = () => {
      stopBtn.disabled = true;
      startBtn.disabled = false;
      recorder.stop();
    };
  </script>
</body>
</html>
